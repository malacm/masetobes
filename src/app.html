<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
		<link rel="dns-prefetch" href="https://cdn.sanity.io" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'alt') document.documentElement.setAttribute('data-theme', 'alt');
				} catch (e) {}
				// The intro's curtain (see src/lib/animations/intro.ts): up before
				// first paint on the first homepage load of the session.
				try {
					if (location.pathname === '/' && !sessionStorage.getItem('intro')) {
						document.documentElement.setAttribute('data-intro', 'pending');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
